# Helm values for the argo/argo-cd chart. Used only by
# scripts/08-install-argocd.sh — unlike the other infrastructure components,
# ArgoCD is deliberately NOT re-adopted as an ArgoCD Application afterwards
# (no self-management). Letting ArgoCD manage its own install risks a bad
# sync locking you out of the one tool you'd need to fix it — see
# docu/04-argocd-gitops.md.
configs:
  params:
    server.insecure: true   # TLS is terminated at the Cilium Ingress below

server:
  ingress:
    enabled: true
    ingressClassName: cilium
    annotations:
      cert-manager.io/cluster-issuer: smartmansion-internal   # self-signed internal CA, see docu/09-cert-manager-dns.md
    hostname: argocd.lan
    tls: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
