# Helm values for the Cilium chart. Used both by scripts/04-install-cilium.sh
# (bootstrap, before ArgoCD exists) and by gitops/infrastructure/cilium/application.yaml
# (ongoing GitOps management) — single source of truth, no drift between the two.
kubeProxyReplacement: true

# Official Talos + Cilium recommendation: talk to Talos's own per-node API
# server load balancer on localhost:7445, not the CLUSTER_VIP directly.
# Talos runs this on every node specifically so in-cluster components (like
# kube-proxy-replacement clients) don't depend on which node currently
# holds the VIP or on its failover latency — it's a separate mechanism from
# the VIP, not a duplicate of it. The VIP (config/cluster.env's
# CLUSTER_VIP) is still what kubectl/talosctl/ArgoCD use from outside the
# cluster.
k8sServiceHost: "localhost"
k8sServicePort: 7445

ipam:
  mode: kubernetes

# Talos mounts cgroupv2 itself; Cilium must not try to do it again.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# REQUIRED on Talos — without these explicit overrides, Cilium's default
# capability set includes things Talos's hardened kernel refuses (SYS_MODULE
# in particular; Talos disallows workloads loading kernel modules at all).
# Confirmed real failure mode: the clean-cilium-state init container
# CrashLoopBackOff'ing with "unable to apply caps: can't apply capabilities:
# operation not permitted" — this is what fixes it. Per Cilium's own
# Talos installation docs.
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# Built-in Ingress Controller so we don't need a separate nginx-ingress
# component. Backs the Ingress resources used by Nextcloud/OnlyOffice/Home
# Assistant (see gitops/apps/*).
ingressController:
  enabled: true
  loadbalancerMode: shared
  default: true

# LB-IPAM + L2 announcements: on bare-metal VirtualBox (no cloud load
# balancer), a Service of type LoadBalancer — like the one
# ingressController.enabled creates — would otherwise sit at
# EXTERNAL-IP=<pending> forever. This makes Cilium itself assign it a real
# LAN IP (from the CiliumLoadBalancerIPPool in
# gitops/infrastructure/cilium/manifests/) and answer ARP for it on the
# bridged interface, so INGRESS_VIP (config/cluster.env) is reachable from
# any device on the LAN — including the Windows host — on ports 80/443
# directly, no NodePort, no extra port in the URL.
l2announcements:
  enabled: true

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true

# NetworkPolicy enforcement (see gitops/apps/*/network-policy.yaml). Note:
# pods with hostNetwork:true (Home Assistant) bypass this — see
# docu/03-cilium-networkpolicies.md.
policyEnforcementMode: default
