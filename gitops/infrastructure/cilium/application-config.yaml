# Syncs the raw manifests in manifests/ (CiliumLoadBalancerIPPool,
# CiliumL2AnnouncementPolicy) — separate from application.yaml (the Cilium
# Helm chart itself) because these resources use Cilium's own CRDs and must
# be applied strictly after the chart. Wave -9: right after the chart
# (-10), before every other component (-5 and later) — ingress needs to be
# reachable before anything meaningfully needs it to be.
#
# repoURL below is already set to this project's GitHub repo. If you fork or
# rename it, update GITOPS_REPO_URL in config/cluster.env and re-run
# scripts/10-bootstrap-argocd-apps.sh, which re-templates every occurrence.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
spec:
  project: default
  source:
    repoURL: https://github.com/geigervlad/Smartmansion_k8s_talos.git
    targetRevision: main
    path: gitops/infrastructure/cilium/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
