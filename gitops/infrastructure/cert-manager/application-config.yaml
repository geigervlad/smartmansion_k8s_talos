# Syncs the raw manifests in manifests/ (cluster-issuers.yaml — the
# self-signed internal CA, see docu/09-cert-manager-dns.md) — separate from
# application.yaml (the cert-manager Helm chart itself) because these
# resources use cert-manager's own CRDs and must be applied strictly after
# the chart. Wave -3: after gitops/sealed-secrets (wave -4) — no actual
# dependency between them anymore (this ClusterIssuer needs no secret), but
# there's no reason to reorder it back either.
#
# repoURL below is already set to this project's GitHub repo. If you fork or
# rename it, update GITOPS_REPO_URL in config/cluster.env and re-run
# scripts/10-bootstrap-argocd-apps.sh, which re-templates every occurrence.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: cert-manager
  source:
    repoURL: https://github.com/geigervlad/Smartmansion_k8s_talos.git
    targetRevision: main
    path: gitops/infrastructure/cert-manager/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
