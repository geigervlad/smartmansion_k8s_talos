# Syncs the raw manifests in manifests/ (desec-webhook, ClusterIssuers) —
# separate from application.yaml (the cert-manager Helm chart itself)
# because these resources use cert-manager's own CRDs and must be applied
# strictly after the chart. Wave -3: after gitops/sealed-secrets (wave -4),
# since the ClusterIssuers reference the desec-token Secret that lives
# there now (see gitops/sealed-secrets/application.yaml) — the desec-token
# SealedSecret used to live in manifests/ next to this file, moved out so
# every generated secret lives in one place.
#
# repoURL below is already set to this project's GitHub repo. If you fork or
# rename it, update GITOPS_REPO_URL in config/cluster.env and re-run
# scripts/10-bootstrap-argocd-apps.sh, which re-templates every occurrence.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://github.com/geigervlad/Smartmansion_k8s_talos.git
    targetRevision: main
    path: gitops/infrastructure/cert-manager/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
