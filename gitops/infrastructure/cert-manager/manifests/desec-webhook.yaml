# Vendored from https://github.com/kmorning/cert-manager-webhook-desec
# (examples/deploy/desec-webhook.yaml, commit as of 2026-09), with:
#   - namespace changed from "default" to "cert-manager" everywhere
#   - `replicas` and `resources` filled in (blank in upstream)
#   - Role "secret-reader" scoped to the one secret it actually needs
#
# This is a COMMUNITY, single-maintainer project — no published container
# image tag other than `:latest`, no Helm chart. Deliberately chosen anyway
# (see docu/09-cert-manager-dns.md for the tradeoffs and alternatives that
# were considered). If it stops working, check upstream for changes before
# assuming this file is wrong.
#
# groupName `acme.ukmetrics.ca` is the upstream author's own domain, used
# only as a unique Kubernetes API group identifier — it does not need to
# belong to you and is not related to smartmansion.de in any way. Left as
# upstream default to minimize the chance of a typo across the 4 places
# it must match (ClusterRole apiGroups, container env var, APIService
# group/name, and the ClusterIssuer's dns01.webhook.groupName).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: desec-webhook
  namespace: cert-manager
  labels:
    app: desec-webhook
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: desec-webhook:domain-solver
  labels:
    app: desec-webhook
rules:
  - apiGroups:
      - acme.ukmetrics.ca
    resources:
      - '*'
    verbs:
      - 'create'
---
# apiserver gets the auth-delegator role to delegate auth decisions to the
# core apiserver
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: desec-webhook:auth-delegator
  labels:
    app: desec-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: desec-webhook
    namespace: cert-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: desec-webhook:domain-solver
  labels:
    app: desec-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: desec-webhook:domain-solver
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
---
# Lets the webhook read only the one secret it needs (the deSEC API token,
# created by scripts/09-generate-app-secrets.sh as a SealedSecret next to
# this file).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: desec-webhook:secret-reader
  namespace: cert-manager
  labels:
    app: desec-webhook
rules:
  - apiGroups: [""]
    resources:
      - 'secrets'
    resourceNames:
      - desec-token
    verbs:
      - 'get'
      - 'watch'
      - 'list'
---
# Grant the webhook permission to read the ConfigMap containing the
# Kubernetes apiserver's requestheader-ca-certificate. Created automatically
# by the apiserver in kube-system.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: desec-webhook:webhook-authentication-reader
  namespace: kube-system
  labels:
    app: desec-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: desec-webhook
    namespace: cert-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: desec-webhook:secret-reader
  namespace: cert-manager
  labels:
    app: desec-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: desec-webhook:secret-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: desec-webhook
    namespace: cert-manager
---
apiVersion: v1
kind: Service
metadata:
  name: desec-webhook
  namespace: cert-manager
  labels:
    app: desec-webhook
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: https
      protocol: TCP
      name: https
  selector:
    app: desec-webhook
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: desec-webhook
  namespace: cert-manager
  labels:
    app: desec-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: desec-webhook
  template:
    metadata:
      labels:
        app: desec-webhook
    spec:
      serviceAccountName: desec-webhook
      containers:
        - name: desec-webhook
          image: "kmorning/cert-manager-webhook-desec:latest"
          imagePullPolicy: IfNotPresent
          args:
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
          env:
            - name: GROUP_NAME
              value: "acme.ukmetrics.ca"
          ports:
            - name: https
              containerPort: 443
              protocol: TCP
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          volumeMounts:
            - name: certs
              mountPath: /tls
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: certs
          secret:
            secretName: desec-webhook-webhook-tls
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.acme.ukmetrics.ca
  labels:
    app: desec-webhook
  annotations:
    cert-manager.io/inject-ca-from: "cert-manager/desec-webhook-webhook-tls"
spec:
  group: acme.ukmetrics.ca
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: desec-webhook
    namespace: cert-manager
  version: v1alpha1
---
# Self-signed bootstrap chain used only to mint the webhook's own serving
# certificate (so the k8s apiserver can call it over TLS) — unrelated to the
# public smartmansion.de certificates issued via the ClusterIssuers below.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: desec-webhook-selfsign
  namespace: cert-manager
  labels:
    app: desec-webhook
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: desec-webhook-ca
  namespace: cert-manager
  labels:
    app: desec-webhook
spec:
  secretName: desec-webhook-ca
  duration: 43800h # 5y
  issuerRef:
    name: desec-webhook-selfsign
  commonName: "ca.desec-webhook.cert-manager"
  isCA: true
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: desec-webhook-ca
  namespace: cert-manager
  labels:
    app: desec-webhook
spec:
  ca:
    secretName: desec-webhook-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: desec-webhook-webhook-tls
  namespace: cert-manager
  labels:
    app: desec-webhook
spec:
  secretName: desec-webhook-webhook-tls
  duration: 8760h # 1y
  issuerRef:
    name: desec-webhook-ca
  dnsNames:
    - desec-webhook
    - desec-webhook.cert-manager
    - desec-webhook.cert-manager.svc
