# The ONLY ClusterIssuer in this project — a self-signed internal CA. Zero
# external dependencies (no ACME account, no DNS-01, no public DNS
# reachability at all): works entirely offline, which fits this project's
# .lan-only access model (see docu/09-cert-manager-dns.md). Every app
# Ingress uses cert-manager.io/cluster-issuer: smartmansion-internal.
#
# Devices need the CA certificate imported once to avoid browser TLS
# warnings — scripts/06-install-cert-manager.sh exports it to
# secrets-vault/smartmansion-ca.crt after this issues; see
# docu/09-cert-manager-dns.md for the (manual, by design) import step.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: smartmansion-internal-ca
  namespace: cert-manager
spec:
  secretName: smartmansion-internal-ca
  duration: 87600h # 10y
  renewBefore: 720h # 30d
  isCA: true
  commonName: "smartmansion internal CA"
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: smartmansion-internal
spec:
  ca:
    secretName: smartmansion-internal-ca
