# No Helm chart (rancher/local-path-provisioner doesn't publish one) — plain
# directory sync of manifests.yaml. Sync-wave -5, same slot Longhorn used to
# occupy — no ordering dependency on/from cert-manager, sealed-secrets or
# Cilium, all must be up before apps (wave 0).
#
# repoURL below is already set to this project's GitHub repo. If you fork or
# rename it, update GITOPS_REPO_URL in config/cluster.env and re-run
# scripts/10-bootstrap-argocd-apps.sh, which re-templates every occurrence.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-provisioner
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    repoURL: https://github.com/geigervlad/Smartmansion_k8s_talos.git
    targetRevision: main
    path: gitops/infrastructure/local-path-provisioner
    directory:
      include: "manifests.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
