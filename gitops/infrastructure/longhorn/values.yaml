# Helm values for the longhorn/longhorn chart. Used both by
# scripts/07-install-longhorn.sh (bootstrap) and application.yaml (ongoing
# GitOps management).
defaultSettings:
  # Talos's UserVolumeConfig always mounts at /var/mnt/<name> (not
  # configurable) — this MUST match `metadata.name: longhorn` in the
  # UserVolumeConfig document generated by scripts/02-generate-talos-config.sh.
  defaultDataPath: /var/mnt/longhorn
  replicaAutoBalance: best-effort
  # All 6 nodes have a Longhorn disk and the node label from
  # talos/patches/common.yaml (see NODE_LONGHORN_DISK_GB in config/cluster.env).
  systemManagedComponentsNodeSelector: "node.smartmansion.io/storage:longhorn"

persistence:
  defaultClassReplicaCount: 3   # 3 replicas spread across the 6 available storage nodes

longhornManager:
  nodeSelector:
    node.smartmansion.io/storage: "longhorn"

longhornDriver:
  nodeSelector:
    node.smartmansion.io/storage: "longhorn"
