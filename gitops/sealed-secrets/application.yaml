# Every SealedSecret generated by scripts/09-generate-app-secrets.sh lives
# in this ONE folder, regardless of which namespace it actually targets
# (each file's own metadata.namespace decides that — ArgoCD doesn't need
# them colocated with the component that consumes them). Deliberately
# separate from gitops/infrastructure/sealed-secrets/, which is the
# SealedSecrets *controller* itself (Helm chart, values, pub-cert.pem) —
# this directory is only ever the encrypted output of that controller.
#
# Sync-wave -4: strictly after the controller (wave -5, so the SealedSecret
# CRD + decrypting webhook already exist) and strictly before
# cert-manager-config (wave -3, which needs desec-token to exist for its
# ClusterIssuers) and every app (default wave 0, all of which need their own
# secret decrypted into a real Secret before their pods can start).
#
# repoURL below is already set to this project's GitHub repo. If you fork or
# rename it, update GITOPS_REPO_URL in config/cluster.env and re-run
# scripts/10-bootstrap-argocd-apps.sh, which re-templates every occurrence.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-data
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: default
  source:
    repoURL: https://github.com/geigervlad/Smartmansion_k8s_talos.git
    targetRevision: main
    path: gitops/sealed-secrets
    directory:
      exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets   # only a default — every manifest here sets its own metadata.namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
