# The single "app of apps" — this is the only Application ever applied by
# hand (scripts/10-bootstrap-argocd-apps.sh does it once via `kubectl
# apply`). It recursively watches gitops/ for every other Application
# manifest (cilium (+ its LB-IPAM/L2 config), cert-manager (+ its config),
# local-path-provisioner, sealed-secrets (the controller) +
# sealed-secrets-data (every generated SealedSecret, see
# gitops/sealed-secrets/), argocd (itself — manual-sync-only, see
# gitops/infrastructure/argocd/application.yaml and docu/04-argocd-gitops.md),
# nextcloud, onlyoffice, homeassistant) and keeps them in sync — that's the
# entire GitOps bootstrap.
#
# `include: "**/{application*,appproject,infra-projects}.yaml"` deliberately
# matches every file named application.yaml / application-config.yaml /
# application-<name>.yaml / appproject.yaml / infra-projects.yaml, so it
# picks up exactly the Application manifests colocated with each component
# plus every AppProject (the per-app ones, each named appproject.yaml next
# to the Application it scopes — see gitops/apps/*/appproject.yaml — and
# gitops/bootstrap/projects/infra-projects.yaml, one file for every
# infrastructure component's AppProject, since those aren't colocated
# 1:1 with a single Application file the way the app-level ones are).
# Ignores values.yaml / namespace.yaml / sealed-secret*.yaml / raw manifests
# (those are synced by the child Applications themselves, into their own
# destinations, not by this root app — each such directory's own
# Application excludes these same files from its directory-sync source for
# that reason).
#
# repoURL below is already set to this project's GitHub repo. If you fork or
# rename it, update GITOPS_REPO_URL in config/cluster.env and re-run
# scripts/10-bootstrap-argocd-apps.sh, which re-templates every occurrence.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/geigervlad/Smartmansion_k8s_talos.git
    targetRevision: main
    path: gitops
    directory:
      recurse: true
      include: "**/{application*,appproject,infra-projects}.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
