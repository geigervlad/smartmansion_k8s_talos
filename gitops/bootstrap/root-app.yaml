# The single "app of apps" — this is the only Application ever applied by
# hand (scripts/10-bootstrap-argocd-apps.sh does it once via `kubectl
# apply`). It recursively watches gitops/ for every other Application
# manifest (cilium, cert-manager, local-path-provisioner, sealed-secrets, dyndns-updater,
# nextcloud, onlyoffice, homeassistant) and keeps them in sync — that's the
# entire GitOps bootstrap.
#
# `include: "**/application*.yaml"` deliberately matches ONLY files named
# application.yaml / application-config.yaml, so it picks up exactly the
# Application manifests colocated with each component and ignores their
# values.yaml / namespace.yaml / sealed-secret.yaml / raw manifests (those
# are synced by the child Applications themselves, into their own
# destinations, not by this root app).
#
# repoURL below is already set to this project's GitHub repo. If you fork or
# rename it, update GITOPS_REPO_URL in config/cluster.env and re-run
# scripts/10-bootstrap-argocd-apps.sh, which re-templates every occurrence.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/geigervlad/Smartmansion_k8s_talos.git
    targetRevision: main
    path: gitops
    directory:
      recurse: true
      include: "**/application*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
