# Deployed via the pajikos/home-assistant Helm chart (see values.yaml for
# why) — multi-source Application, same pattern as nextcloud: the chart
# itself, this directory's values.yaml as a separate $values ref, and this
# directory again (minus this file and values.yaml) synced as raw manifests
# for namespace.yaml/network-policy.yaml, which the chart doesn't manage.
#
# repoURL below is already set to this project's GitHub repo. If you fork or
# rename it, update GITOPS_REPO_URL in config/cluster.env and re-run
# scripts/10-bootstrap-argocd-apps.sh, which re-templates every occurrence.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homeassistant
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://pajikos.github.io/home-assistant-helm-chart/
      chart: home-assistant
      targetRevision: 0.3.81
      helm:
        valueFiles:
          - $values/gitops/apps/homeassistant/values.yaml
    - repoURL: https://github.com/geigervlad/Smartmansion_k8s_talos.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/geigervlad/Smartmansion_k8s_talos.git
      targetRevision: main
      path: gitops/apps/homeassistant
      directory:
        exclude: "{values.yaml,application.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: homeassistant
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
