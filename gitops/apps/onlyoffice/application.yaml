# No Helm chart (see deployment.yaml for why) — plain directory sync of
# every manifest in this folder except this file itself (already applied at
# the argocd-namespace level by gitops/bootstrap/root-app.yaml). The
# SealedSecret this app needs (onlyoffice-secrets) now lives in
# gitops/sealed-secrets/ instead of here — see that directory's
# application.yaml.
#
# repoURL below is already set to this project's GitHub repo. If you fork or
# rename it, update GITOPS_REPO_URL in config/cluster.env and re-run
# scripts/10-bootstrap-argocd-apps.sh, which re-templates every occurrence.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onlyoffice
  namespace: argocd
spec:
  project: onlyoffice
  source:
    repoURL: https://github.com/geigervlad/Smartmansion_k8s_talos.git
    targetRevision: main
    path: gitops/apps/onlyoffice
    directory:
      exclude: "{application.yaml,appproject.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: onlyoffice
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
