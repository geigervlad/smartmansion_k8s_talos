# Plain PostgreSQL for Nextcloud — the official docker.io/library/postgres
# image directly, no chart, no operator. Deliberately NOT Bitnami (see
# docu/11-troubleshooting.md) and deliberately NOT an HA operator like
# CloudNativePG: this is a single homelab Nextcloud instance, not a system
# that needs automatic failover — one StatefulSet, one PVC, same "radically
# simpler" pattern already used for local-path-provisioner in this repo.
#
# POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB below come from the SAME
# "nextcloud-secrets" SealedSecret (db-username/db-password keys) that
# gitops/apps/nextcloud/values.yaml's externalDatabase.existingSecret
# points Nextcloud itself at — one secret, two consumers, so they can never
# drift out of sync with each other.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nextcloud-postgresql
  namespace: nextcloud
spec:
  serviceName: nextcloud-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud-postgresql
  template:
    metadata:
      labels:
        app: nextcloud-postgresql
    spec:
      # Non-root by default (UID/GID 999, the image's own "postgres" user) —
      # everything below exists to make that work cleanly rather than
      # fighting the image's own root-required first-boot steps.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      initContainers:
        # The existing PVC's data directory was created (and, on a fresh
        # volume, will still be created) while a previous non-hardened
        # revision of this manifest ran as root — chown it once, every
        # start, before the hardened main container (which can't chown its
        # own files without CAP_CHOWN) touches it. Idempotent: a no-op once
        # ownership is already correct.
        - name: fix-permissions
          image: postgres:18.6-alpine
          command: ["sh", "-c", "chown -R 999:999 /var/lib/postgresql/data"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgresql
          image: postgres:18.6-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # NOTE: logs a harmless "chmod: /var/run/postgresql: Operation not
          # permitted" on every start — that path is the container's own
          # ephemeral filesystem (not a mounted volume), owned by root by
          # default, and postgres's entrypoint can't chmod it without
          # CAP_CHOWN. It falls back and serves connections fine regardless
          # (verified: "database system is ready to accept connections"
          # follows immediately) — not worth an emptyDir + fsGroup dance for
          # a cosmetic log line.
          env:
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: db-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: db-password
            # Subdirectory, not the mount root itself — postgres refuses to
            # initdb into a non-empty directory, and the volume root always
            # has a lost+found dir on a fresh local-path PVC.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgresql
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
---
# Headless (clusterIP: None) — required by StatefulSet's spec.serviceName,
# and gives the single pod a stable DNS name either way.
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-postgresql
  namespace: nextcloud
spec:
  clusterIP: None
  selector:
    app: nextcloud-postgresql
  ports:
    - port: 5432
      targetPort: postgresql
