# Helm values for the nextcloud/nextcloud chart (https://nextcloud.github.io/helm/).
# Secret keys referenced below (nextcloud-username/-password,
# mariadb-root-password/-password) are sealed by
# scripts/09-generate-app-secrets.sh into sealed-secret.yaml next to this file
# — see that script for exactly which keys exist in "nextcloud-secrets".
nextcloud:
  host: smartmansion.de
  trustedDomains:
    - smartmansion.de
  existingSecret:
    enabled: true
    secretName: nextcloud-secrets
    usernameKey: nextcloud-username
    passwordKey: nextcloud-password

# TLS is terminated at the Cilium Ingress, not by the Nextcloud pod itself —
# without this, Nextcloud thinks every request is plain HTTP and generates
# broken (http://) links/redirects.
phpClientHttpsFix:
  enabled: true
  protocol: https

internalDatabase:
  enabled: false   # using the bundled mariadb subchart instead

mariadb:
  enabled: true
  # Broadcom moved almost all bitnami/* images to bitnamilegacy/* on Docker
  # Hub in August 2025 (commercial "Bitnami Secure Images" push) — the
  # chart's default image reference (docker.io/bitnami/mariadb) 404s as a
  # result. bitnamilegacy/* is an unmaintained archive (same tags, frozen,
  # no further updates) — fine short-term, but if this breaks again later,
  # that's why: check https://github.com/bitnami/charts/issues/35164 and
  # consider pinning to a self-hosted mirror or switching to a
  # non-Bitnami MariaDB image entirely.
  image:
    registry: docker.io
    repository: bitnamilegacy/mariadb
  auth:
    database: nextcloud
    username: nextcloud
    existingSecret: nextcloud-secrets
  primary:
    persistence:
      enabled: true
      storageClass: local-path
      size: 20Gi

persistence:
  enabled: true
  storageClass: local-path
  size: 100Gi
  accessMode: ReadWriteOnce

ingress:
  enabled: true
  className: cilium
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging   # switch to letsencrypt-prod once validated, see docu/09-cert-manager-dns.md
  tls:
    - secretName: nextcloud-tls
      hosts:
        - smartmansion.de

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1536Mi
