# Helm values for the nextcloud/nextcloud chart (https://nextcloud.github.io/helm/).
# PostgreSQL and Redis are NOT the chart's bundled subcharts (those are all
# Bitnami-sourced, and Bitnami's free images/charts were effectively
# discontinued in 2025 — see docu/11-troubleshooting.md) — instead both run
# as plain manifests in this same directory (postgresql.yaml, redis.yaml),
# and the chart is pointed at them via externalDatabase/externalRedis.
#
# Secret keys referenced below (nextcloud-username/-password, db-username,
# db-password, redis-password) are sealed by
# scripts/09-generate-app-secrets.sh into gitops/sealed-secrets/nextcloud-secrets.yaml
# — see that script for exactly which keys exist in "nextcloud-secrets".
nextcloud:
  host: smartmansion.de
  trustedDomains:
    - smartmansion.de
  existingSecret:
    enabled: true
    secretName: nextcloud-secrets
    usernameKey: nextcloud-username
    passwordKey: nextcloud-password

# TLS is terminated at the Cilium Ingress, not by the Nextcloud pod itself —
# without this, Nextcloud thinks every request is plain HTTP and generates
# broken (http://) links/redirects.
phpClientHttpsFix:
  enabled: true
  protocol: https

internalDatabase:
  enabled: false

# Chart's bundled subcharts — all Bitnami, not used (see comment above).
mariadb:
  enabled: false
postgresql:
  enabled: false
redis:
  enabled: false

##
## External PostgreSQL — plain postgres:18 container (postgresql.yaml in
## this directory), not a Bitnami subchart. Single instance, ReadWriteOnce
## PVC: a homelab database, not something that needs an HA operator.
##
externalDatabase:
  enabled: true
  type: postgresql
  host: nextcloud-postgresql
  database: nextcloud
  existingSecret:
    enabled: true
    secretName: nextcloud-secrets
    usernameKey: db-username
    passwordKey: db-password

##
## External Redis — plain valkey (open-source Redis fork, Linux Foundation
## governed) container (redis.yaml in this directory), not a Bitnami
## subchart. Used by Nextcloud for transactional file locking and
## APCu-adjacent caching (redis.config.php, a default config in the
## nextcloud/docker image, auto-wires this once externalRedis.enabled is
## true; see https://github.com/nextcloud/docker).
##
externalRedis:
  enabled: true
  host: nextcloud-redis
  existingSecret:
    enabled: true
    secretName: nextcloud-secrets
    passwordKey: redis-password

persistence:
  enabled: true
  storageClass: local-path
  size: 100Gi
  accessMode: ReadWriteOnce

ingress:
  enabled: true
  className: cilium
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging   # switch to letsencrypt-prod once validated, see docu/09-cert-manager-dns.md
  tls:
    - secretName: nextcloud-tls
      hosts:
        - smartmansion.de

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1536Mi
