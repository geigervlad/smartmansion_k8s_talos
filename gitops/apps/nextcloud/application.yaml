# Sync-wave 0 (default) — after every infrastructure Application (all at
# wave -10..-4). namespace.yaml, network-policy.yaml and sealed-secret.yaml
# (generated by scripts/09-generate-app-secrets.sh) are synced from the same
# directory as raw manifests alongside the Helm chart, via ArgoCD's
# multi-source "values"-repo trick applied to this whole directory.
#
# repoURL below is already set to this project's GitHub repo. If you fork or
# rename it, update GITOPS_REPO_URL in config/cluster.env and re-run
# scripts/10-bootstrap-argocd-apps.sh, which re-templates every occurrence.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://nextcloud.github.io/helm/
      chart: nextcloud
      targetRevision: 6.3.2
      helm:
        valueFiles:
          - $values/gitops/apps/nextcloud/values.yaml
    - repoURL: https://github.com/geigervlad/Smartmansion_k8s_talos.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/geigervlad/Smartmansion_k8s_talos.git
      targetRevision: main
      path: gitops/apps/nextcloud
      directory:
        exclude: "{values.yaml,application.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: nextcloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
