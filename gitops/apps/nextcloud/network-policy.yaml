# Default-deny ingress within the nextcloud namespace, with explicit allows.
# Egress is left open (DNS, package/app-store updates, push notifications,
# etc.) — only ingress is restricted here; see docu/03-cilium-networkpolicies.md
# for why that scope was chosen.
#
# fromEntities: [ingress] is Cilium's own identity for traffic arriving via
# its built-in Ingress Controller (see gitops/infrastructure/cilium/values.yaml)
# — this is what lets https://nextcloud.localhost reach the pod at all.
# fromEndpoints: [{}] allows same-namespace traffic (nextcloud <-> its postgresql/redis pods).
# The onlyoffice namespace is allowed explicitly both ways (this file + the
# matching rule in gitops/apps/onlyoffice/network-policy.yaml) for the
# Nextcloud <-> OnlyOffice Document Server WOPI callback traffic.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nextcloud-allow
  namespace: nextcloud
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
    - fromEndpoints:
        - {}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: onlyoffice
